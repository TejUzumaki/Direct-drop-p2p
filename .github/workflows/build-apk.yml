name: Build DirectDrop APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'
          
      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true
        
      - name: Install Capacitor & Create Config
        run: |
          mkdir -p www
          echo "<html><body>Loading DirectDrop...</body></html>" > www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init DirectDrop com.tejuzumaki.directdrop --web-dir www
          cat << 'JSON' > capacitor.config.json
          {
            "appId": "com.tejuzumaki.directdrop",
            "appName": "DirectDrop",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "url": "https://directdropxtej.vercel.app"
            }
          }
          JSON
          npx cap add android
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DirectDrop-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
