name: Build DirectDrop APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore directdrop.keystore \
            -alias directdrop \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass directdrop123 -keypass directdrop123 \
            -dname "CN=DirectDrop, OU=Dev, O=Tejas, L=Earth, ST=Earth, C=IN"

      - name: Initialize Bubblewrap
        run: |
          bubblewrap init \
            --manifest https://raw.githubusercontent.com/TejUzumaki/Direct-drop-p2p/main/manifest.json \
            --packageId com.tejuzumaki.directdrop \
            --displayname "DirectDrop" \
            --jdkPath $JAVA_HOME

      - name: Build APK
        run: |
          bubblewrap build \
            --keystorePath ./directdrop.keystore \
            --keystorePassword directdrop123 \
            --keyAlias directdrop \
            --keyPassword directdrop123

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: DirectDrop-APK
          path: app-release-signed.apk
