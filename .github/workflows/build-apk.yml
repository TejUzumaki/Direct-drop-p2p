name: Build DirectDrop APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Accept Android Licenses
        run: |
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
        
      - name: Install Capacitor v6 & Asset Generator
        run: |
          mkdir -p www
          echo "<html><body>Loading DirectDrop...</body></html>" > www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets
          
      - name: Initialize Config & Android
        run: |
          cat << 'JSON' > capacitor.config.json
          {
            "appId": "com.tejuzumaki.directdrop",
            "appName": "DirectDrop",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "url": "https://direct-drop-p2p.vercel.app"
            }
          }
          JSON
          npx cap add android
          
      - name: Generate Native Icons
        run: |
          mkdir -p resources
          if [ -f icon.png ]; then
            cp icon.png resources/icon.png
            npx capacitor-assets generate --android
            echo "Icons generated successfully."
          else
            echo "icon.png not found, using default Capacitor icon."
          fi
          
      - name: Inject Android Permissions (Notifications, Mic, Camera, Vibrate, Storage)
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n<uses-permission android:name="android.permission.RECORD_AUDIO" />\n<uses-permission android:name="android.permission.CAMERA" />\n<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n<uses-permission android:name="android.permission.VIBRATE" />\n<application|g' android/app/src/main/AndroidManifest.xml
          
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DirectDrop-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
