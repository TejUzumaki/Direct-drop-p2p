name: Build DirectDrop APK (Capacitor)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Project
        run: |
          npx cap init DirectDrop com.tejuzumaki.directdrop --web-dir www
          rm -f capacitor.config.ts
          cat << 'JSON' > capacitor.config.json
          {
            "appId": "com.tejuzumaki.directdrop",
            "appName": "DirectDrop",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "url": "https://directdropxtej.vercel.app"
            }
          }
          JSON

      - name: Build Android APK
        run: |
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DirectDrop-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
